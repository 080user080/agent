name: CI

on:
  push:
    branches: [main, ci-windows-clean]
  pull_request:
    branches: [main]

# Права за замовчуванням — тільки read (GitHub Actions hardening)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .
        continue-on-error: true  # поки не прийняли форматер — лише інформативно

  tests:
    name: Tests (pytest, Windows)
    runs-on: windows-latest
    # Windows-прогін: всі Windows-залежності (pywin32, uiautomation, pywinauto)
    # встановлюються нативно. Mock-заглушки з conftest.py не використовуються.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract OCR
        run: choco install tesseract --no-progress

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: |
          pip install playwright
          playwright install chromium

      - name: Run pytest
        shell: powershell
        run: pytest --cov=functions --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
